name: Monitor Game Updates

# Watches the official Dawn of War IV Steam news feed and opens a labeled
# GitHub issue for every new item (patch notes, announcements, events).
# The issue body carries the full RSS content so a human/agent can turn it
# into a draft article PR without re-fetching. Idempotent: one issue per
# feed item (searches existing issues before creating). No secrets, no LLM.
#
# Feed format note: Steam's app news feed is RSS 2.0 (<item>/<guid>), not
# Atom — verified against the live feed 2026-11-11.

on:
  schedule:
    - cron: "0 */4 * * *" # every 4 hours (UTC)
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: monitor-updates
  cancel-in-progress: false

env:
  STEAM_APP_ID: "2272360"
  LABEL: game-update

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch Steam news RSS
        run: |
          curl -sfL --max-time 60 \
            "https://store.steampowered.com/feeds/news/app/${STEAM_APP_ID}/" \
            -o news.xml
          # Fail loudly on an empty/invalid feed rather than silently no-oping.
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('news.xml')"

      - name: Open issue for each new feed item
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # no checkout step → gh can't infer repo from git
          REPO: ${{ github.repository }}
          LABEL: ${{ env.LABEL }}
        run: |
          gh label create "$LABEL" --color D93A3A --description "Auto-detected game update feed item" || true
          python3 - <<'EOF'
          import json, os, subprocess, sys
          import xml.etree.ElementTree as ET

          repo, label = os.environ["REPO"], os.environ["LABEL"]

          def gh(*args, check=True):
              cmd = ["gh", *args]
              if args[0] == "issue":
                  cmd += ["-R", repo]
              r = subprocess.run(cmd, capture_output=True, text=True)
              if check and r.returncode != 0:
                  print(f"gh {' '.join(args)} failed:\n{r.stderr}", file=sys.stderr)
                  sys.exit(r.returncode)
              return r

          # Steam app news = RSS 2.0. Parse both shapes for future-proofing,
          # prefer <item>; fall back to Atom <entry>.
          tree = ET.parse("news.xml")
          items = tree.findall(".//item")
          if items:
              def fields(e):
                  return (
                      (e.findtext("title") or "").strip(),
                      (e.findtext("link") or "").strip(),
                      (e.findtext("guid") or "").strip(),
                      (e.findtext("pubDate") or "").strip(),
                      (e.findtext("description") or "").strip(),
                  )
          else:
              ns = {"a": "http://www.w3.org/2005/Atom"}

              def fields(e):
                  link = next((l.get("href", "") for l in e.findall("a:link", ns)), "")
                  return (
                      (e.findtext("a:title", default="", namespaces=ns) or "").strip(),
                      link,
                      link,
                      (e.findtext("a:updated", default="", namespaces=ns) or "").strip(),
                      (e.findtext("a:content", default="", namespaces=ns) or "").strip(),
                  )

          existing = json.loads(gh("issue", "list", "--label", label, "--state", "all",
                                   "--limit", "300", "--json", "title").stdout)
          seen = {i["title"].removeprefix("[game-update] ") for i in existing}

          created = 0
          for e in items[:15]:  # newest 15; older items are history, not news
              title, link, guid, pub, content = fields(e)
              if not title or title in seen:
                  continue
              body = (
                  f"**Auto-detected Steam news item**\n\n"
                  f"- Published: {pub}\n- GUID: `{guid}`\n- Source: {link}\n\n"
                  "<details><summary>Full feed content — raw material for the article</summary>\n\n"
                  f"{content[:20000]}\n\n</details>\n\n"
                  "---\n"
                  "## Next steps (human/agent)\n"
                  "1. Classify: patch notes / event / announcement / minor\n"
                  "2. Draft or update the article (`draft: true` until every number is verified)\n"
                  "3. Update affected pages (unit stats, roadmap, release info)\n"
                  "4. Close this issue when the content PR merges."
              )
              r = gh("issue", "create", "--label", label,
                     "--title", f"[game-update] {title[:120]}",
                     "--body", body, check=False)
              if r.returncode == 0:
                  created += 1
              else:
                  print(f"create failed for {title!r}: {r.stderr}", file=sys.stderr)

          print(f"feed items: {len(items)}, new issues: {created}")
          if len(items) == 0:
              print("WARNING: feed parsed but contained 0 items — check format", file=sys.stderr)
          EOF
